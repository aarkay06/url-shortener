AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: URL shortener API, Cognito User Pool, Lambda functions, and DynamoDB table.

Parameters:
  PublicShortBaseUrl:
    Type: String
    Default: https://url.aarkay.tech
    Description: Public domain that short links should use (no trailing slash).
  FrontendOrigin:
    Type: String
    Default: https://url.aarkay.tech
    Description: Browser origin allowed to call the API.
  LinkTtlDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Number of days a new short link remains valid.

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref LinksTable
        LINK_TTL_DAYS: !Ref LinkTtlDays
    Tracing: Active

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: url-shortener-users-dev
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: url-shortener-web-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  ShortenerApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref FrontendOrigin
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - PATCH
          - DELETE
          - OPTIONS
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}"
              audience:
                - !Ref UserPoolClient
            IdentitySource: "$request.header.Authorization"

  LinksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: url-shortener-links-dev
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: code
          AttributeType: S
        - AttributeName: userId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: N
      KeySchema:
        - AttributeName: code
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: userId-createdAt-index
          KeySchema:
            - AttributeName: userId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  CreateLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/createLink.handler
      Environment:
        Variables:
          SHORT_BASE_URL: !Ref PublicShortBaseUrl
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref LinksTable
      Events:
        CreateLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerApi
            Path: /links
            Method: POST

  RedirectLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/redirectLink.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LinksTable
      Events:
        RedirectLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerApi
            Path: /{code}
            Method: GET

  GetAnalyticsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/getAnalytics.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LinksTable
      Events:
        GetAnalytics:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerApi
            Path: /links/{code}/analytics
            Method: GET

  ListLinksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/listLinks.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LinksTable
      Events:
        ListLinks:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerApi
            Path: /links
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  UpdateLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/updateLink.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LinksTable
      Events:
        UpdateLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerApi
            Path: /links/{code}
            Method: PATCH
            Auth:
              Authorizer: CognitoAuthorizer

  DeleteLinkFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/deleteLink.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref LinksTable
      Events:
        DeleteLink:
          Type: HttpApi
          Properties:
            ApiId: !Ref ShortenerApi
            Path: /links/{code}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed API and generated short links.
    Value: !Sub "https://${ShortenerApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  LinksTableName:
    Value: !Ref LinksTable
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  AwsRegion:
    Description: AWS Region
    Value: !Ref AWS::Region
